<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mcbe Hit Timing Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Custom smooth transition for background state change */
        #app-box {
            transition: background-color 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 select-none">

    <div class="max-w-md w-full flex flex-col items-center gap-4">
        <!-- Header Controls & Info -->
        <div
            class="w-full flex justify-between items-center text-xs font-semibold tracking-wider text-slate-400 uppercase">
            <span>Mcbe Hit Timing Trainer</span>
            <span id="sound-status" class="flex items-center gap-1 text-purple-400">
                By CC_PCT :)
            </span>
        </div>

        <!-- MAIN 400x400 GAME BOX CONTAINER -->
        <div id="app-box"
            class="relative w-[400px] h-[400px] bg-white rounded-2xl shadow-2xl overflow-hidden border-4 border-slate-700/50 cursor-pointer flex flex-col justify-between">

            <!-- TOP HUD / STATUS DISPLAY AREA -->
            <div class="p-5 flex flex-col items-center text-slate-900 pointer-events-none z-10">
                <div id="status-badge"
                    class="px-3 py-1 bg-slate-900/10 backdrop-blur-md rounded-full text-xs font-bold uppercase tracking-wider mb-2 text-slate-800 border border-slate-900/10">
                    Click Anywhere to Start
                </div>
                <div id="time-display"
                    class="text-4xl font-extrabold mono tracking-tight text-slate-900 drop-shadow-sm">
                    0.000<span class="text-xl font-medium">s</span>
                </div>
                <div id="sub-message" class="text-xs font-semibold mt-1 opacity-75 text-center max-w-[280px]">
                    Second click between 0.5 and 0.55 sec
                </div>
            </div>

            <!-- REACTION STATS MINI BOARD -->
            <div
                class="absolute top-[130px] left-0 right-0 px-6 flex justify-around pointer-events-none text-slate-800">
                <div
                    class="text-center bg-white/40 backdrop-blur-md px-3 py-1.5 rounded-xl border border-white/40 shadow-sm">
                    <div class="text-[10px] font-bold uppercase tracking-wider opacity-70">Target</div>
                    <div class="text-sm font-bold mono">0.5s - 0.55s</div>
                </div>
            </div>

            <!-- BOTTOM CANVAS CONTAINER (Height 80px: 50px blocks + 30px label ticks) -->
            <div class="relative w-[400px] h-[85px] bg-slate-950 border-t-2 border-slate-900">
                <canvas id="hit-canvas" width="400" height="85" class="block w-full h-full"></canvas>
            </div>
        </div>

        <div class="w-full grid grid-cols-3 gap-2 text-center text-xs font-medium text-slate-400">
            <div><a href="https://github.com/CCPCT/MCBE-hit-timing-trainer">source</a></div>
            <div><a href="https://discord.gg/chd39EdsxZ">discord</a></div>
        </div>
    </div>

    </div>

    <script src="logic.js"></script>


</body>

</html>
